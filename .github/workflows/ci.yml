name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and Firefox validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff-tree --check --root "$GITHUB_SHA"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and run tests
        run: npm test
      - name: Validate Firefox extension
        run: npm run lint:firefox
      - name: Install Firefox
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Run isolated Firefox smoke test
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run smoke:firefox
      - name: Build unsigned package for review
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: npm run package:firefox
      - name: Compare package size with latest release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/package-size.js
          cat build/package-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: tavvy-ci-package
          path: |
            build/packages/*.zip
            build/package-size.md
          retention-days: 7

  release-pr:
    name: Open or update release PR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download size report
        uses: actions/download-artifact@v4
        with:
          name: tavvy-ci-package
          path: build/ci-package
      - name: Prepare release PR description
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin main
          node scripts/release-pr.js
      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          PR_NUMBER="$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --json body --jq '.body' > build/pr-existing.md
            node scripts/release-pr.js --merge-existing build/pr-existing.md
            gh pr edit "$PR_NUMBER" --body-file build/pr-body.md
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "$(cat build/pr-title.txt)" --body-file build/pr-body.md
          fi
