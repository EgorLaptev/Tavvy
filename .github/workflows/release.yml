name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Firefox release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag points to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate Firefox extension
        run: npm run lint:firefox
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Run isolated Firefox smoke test
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run smoke:firefox
      - name: Build unsigned package
        run: npm run package:firefox
      - name: Build AMO source archive
        run: |
          SOURCE_ARCHIVE="build/tavvy-${GITHUB_REF_NAME#v}-amo-source.zip"
          git archive --format=zip --output="$SOURCE_ARCHIVE" "$GITHUB_SHA"
          {
            echo 'Release build environment (see docs/firefox-review.md for instructions)'
            echo "Commit: $GITHUB_SHA"
            echo "OS: $(uname -srm)"
            cat /etc/os-release
            echo "Node.js: $(node --version)"
            echo "npm: $(npm --version)"
          } > build/AMO-BUILD-ENVIRONMENT.txt
          (cd build && zip -q "$(basename "$SOURCE_ARCHIVE")" AMO-BUILD-ENVIRONMENT.txt)
      - name: Prepare release notes and checksum
        run: node scripts/release-metadata.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$(cat build/release-artifact.txt)" "build/tavvy-${GITHUB_REF_NAME#v}-amo-source.zip" build/SHA256SUMS \
            --verify-tag --title "$(cat build/release-title.txt)" --notes-file build/release-notes.md
