<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs Group</title>
    <link rel="stylesheet" href="dist/app.css" />
  </head>
  <body>
    <main class="popup">
      <div class="groups"></div>
      <div class="settings-view" hidden>
        <section class="settings-group" aria-labelledby="settings-window-title">
        <h2 data-i18n="settings.window.title" id="settings-window-title">Размер окна</h2>
        <label class="setting setting-range"
          ><strong data-i18n="settings.window.width">Ширина</strong
          ><input data-i18n-aria-label="settings.window.width_label"
            id="panel-width"
            type="range"
            min="320"
            max="800"
            step="10"
            aria-label="Ширина окна" /><output for="panel-width"></output></label
        ><label class="setting setting-range"
          ><strong data-i18n="settings.window.height">Высота</strong
          ><input data-i18n-aria-label="settings.window.maximum_height_label"
            id="panel-height"
            type="range"
            min="200"
            max="800"
            step="10"
            aria-label="Максимальная высота окна" /><output for="panel-height"></output></label
        >
        </section>
        <section class="settings-group settings-appearance" aria-labelledby="settings-appearance-title">
        <h2 data-i18n="settings.appearance" id="settings-appearance-title">Оформление</h2>
        <button class="setting theme-open" type="button">
          <strong data-i18n="settings.theme.title">Тема</strong><span class="theme-current">Чёрная</span
          ><svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="m6 4 4 4-4 4" />
          </svg>
        </button>
        <label class="setting"
          ><span><strong data-i18n="settings.animations">Анимации</strong></span
          ><span class="switch"
            ><input data-i18n-aria-label="settings.animations" type="checkbox" aria-label="Анимации" checked /><span
              class="switch-track"
            ></span></span
        ></label>
        <label class="setting"><span><strong data-i18n="settings.dynamic_icon">Динамическая иконка</strong></span><span class="switch"><input data-i18n-aria-label="settings.dynamic_icon" type="checkbox" aria-label="Динамическая иконка" /><span class="switch-track"></span></span></label>
        </section>
        <section class="settings-group" aria-labelledby="settings-tabs-title">
        <h2 data-i18n="settings.tabs_and_groups" id="settings-tabs-title">Вкладки и группы</h2>
        <label class="setting"
          ><span><strong data-i18n="settings.unload_inactive_tabs">Выгружать неактивные вкладки</strong></span
          ><span class="switch"
            ><input data-i18n-aria-label="settings.unload_inactive_tabs"
              type="checkbox"
              aria-label="Выгружать неактивные вкладки" /><span
              class="switch-track"
            ></span></span
        ></label>
        <label class="setting"><span><strong data-i18n="settings.group_pinned_tabs">Закреплённые вкладки по группам</strong></span><span class="switch"><input data-i18n-aria-label="settings.group_pinned_tabs" type="checkbox" aria-label="Закреплённые вкладки по группам" /><span class="switch-track"></span></span></label>
        <label class="setting"><span><strong data-i18n="settings.nested_groups.title">Вложенные группы</strong></span><span class="switch"><input data-i18n-aria-label="settings.nested_groups.title" type="checkbox" aria-label="Вложенные группы" /><span class="switch-track"></span></span></label>
        <label class="setting nested-visibility-setting"><strong data-i18n="settings.nested_groups.show_tabs_from">Показывать вкладки</strong><select data-i18n-aria-label="settings.nested_groups.show_tabs_from" aria-label="Показывать вкладки"><option data-i18n="settings.nested_groups.parent_groups" value="parents">Родительских групп</option><option data-i18n="settings.nested_groups.child_groups" value="children">Дочерних групп</option></select></label>
        </section>
        <section class="settings-group" aria-labelledby="settings-data-title">
        <h2 data-i18n="settings.data" id="settings-data-title">Данные</h2>
        <label class="setting"><span><strong data-i18n="archive.closed_tabs_archive">Архив закрытых вкладок</strong></span><span class="switch"><input data-i18n-aria-label="archive.closed_tabs_archive" type="checkbox" aria-label="Архив закрытых вкладок" /><span class="switch-track"></span></span></label>
        <button class="setting backup-open theme-open" type="button">
          <strong data-i18n="settings.backup.backups">Резервные копии</strong>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4" /></svg>
        </button>
        </section>
      </div>
      <div class="backup-view" hidden>
        <label class="setting"><strong data-i18n="settings.backup.automatic_backups">Автоматические копии</strong><span class="switch"><input data-i18n-aria-label="settings.backup.automatic_backups" type="checkbox" aria-label="Автоматические копии" /><span class="switch-track"></span></span></label>
        <label class="setting backup-frequency" hidden><strong data-i18n="settings.backup.frequency">Частота</strong><select data-i18n-aria-label="settings.backup.backup_frequency" aria-label="Частота копирования"><option data-i18n="settings.backup.every_hour" value="hourly">Каждый час</option><option data-i18n="settings.backup.every_four_hours" value="fourHours">Каждые 4 часа</option><option data-i18n="settings.backup.every_day" value="daily">Каждый день</option><option data-i18n="settings.backup.every_week" value="weekly">Каждую неделю</option><option data-i18n="settings.backup.every_month" value="monthly">Каждый месяц</option></select></label>
        <label class="setting backup-folder-setting"><strong data-i18n="settings.backup.folder_in_downloads">Папка в загрузках</strong><input data-i18n-aria-label="settings.backup.backup_folder_inside_downloads" type="text" class="backup-folder-input" aria-label="Папка для копий внутри загрузок" maxlength="180" autocomplete="off" spellcheck="false" /></label>
        <button type="button" class="setting backup-create"><strong data-i18n="settings.backup.create_backup_now">Создать копию сейчас</strong></button>
        <button data-i18n-aria-label="common.import_action" type="button" class="setting backup-import" aria-label="Импортировать"><strong data-i18n="settings.backup.restore_from_file">Восстановить из файла</strong></button>
        <p data-i18n="settings.backup.folder_downloads_tavvy" class="backup-notice" role="status">Папка: Загрузки/Tavvy</p>
      </div>
      <div class="theme-view" hidden>
        <label class="theme-option"
          ><span data-i18n="settings.theme.black">Чёрная</span
          ><input type="radio" name="theme" value="Чёрная" /></label
        ><label class="theme-option"
          ><span data-i18n="settings.theme.dark">Тёмная</span
          ><input type="radio" name="theme" value="Тёмная" /></label
        ><label class="theme-option"
          ><span data-i18n="settings.theme.light">Светлая</span
          ><input type="radio" name="theme" value="Светлая" /></label
        ><label class="theme-option"
          ><span data-i18n="settings.theme.default">Стандартная</span
          ><input type="radio" name="theme" value="Стандартная" /></label
        ><label class="theme-option"
          ><span data-i18n="settings.theme.system">Как в системе</span
          ><input type="radio" name="theme" value="Как в системе"
        /></label>
      </div>
      <div class="settings-bar" hidden>
        <button type="button" class="settings-back">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10 3 5 8l5 5" /></svg
          ><span data-i18n="common.back" class="back-label">Назад</span></button
        ><a data-i18n-aria-label="common.project_on_github" data-i18n-title="common.project_on_github" class="backup-icon github-link" href="https://github.com/EgorLaptev/Tavvy" target="_blank" rel="noopener noreferrer" aria-label="Проект на GitHub" title="Проект на GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.82c.56.1.76-.24.76-.54v-2.09c-3.11.68-3.77-1.32-3.77-1.32-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.62 1.22 3.26.93.1-.72.39-1.22.71-1.5-2.48-.29-5.1-1.24-5.1-5.54 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.08 1.15a10.7 10.7 0 0 1 5.61 0c2.13-1.45 3.08-1.15 3.08-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.31-2.62 5.25-5.12 5.53.4.35.76 1.03.76 2.07v3.09c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z" /></svg></a>
      </div>
      <div class="recent-list" hidden></div>
      <div class="archive-bar" hidden>
        <button class="archive-back" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10 3 5 8l5 5" /></svg
          ><span data-i18n="common.back" class="back-label">Назад</span></button
        ><button data-i18n-aria-label="archive.hold_to_clear_recently_closed"
          class="archive-clear"
          type="button"
          aria-label="Удерживайте для очистки архива"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <defs>
              <clipPath id="flame-clip">
                <path
                  d="M8 1.5c.3 3-2 3.8-2.3 5.7-.8-.4-1.1-1-1.2-1.7C2 8.6 3.5 14 8 14s6-4.4 3.3-7.6c-.1 1-.7 1.6-1.2 1.8C10.4 5.5 9 3.1 8 1.5Z"
                />
              </clipPath>
            </defs>
            <rect
              class="flame-fill"
              x="0"
              y="0"
              width="16"
              height="16"
              clip-path="url(#flame-clip)"
            />
            <path
              d="M8 1.5c.3 3-2 3.8-2.3 5.7-.8-.4-1.1-1-1.2-1.7C2 8.6 3.5 14 8 14s6-4.4 3.3-7.6c-.1 1-.7 1.6-1.2 1.8C10.4 5.5 9 3.1 8 1.5Z"
            />
          </svg>
        </button>
      </div>
      <div class="bottom-bar">
        <label class="search"
          ><svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" />
            <path d="m10.5 10.5 3 3" /></svg
          ><input data-i18n-aria-label="common.search" data-i18n-placeholder="common.search" type="search" placeholder="Поиск" aria-label="Поиск" /></label
        ><button data-i18n-aria-label="common.settings"
          class="create settings-button"
          type="button"
          aria-label="Настройки"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
          >
            <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
              d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"
            />
          </svg></button
        ><button data-i18n-aria-label="groups.delete_group" class="group-trash" type="button" aria-label="Удалить группу">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
          >
            <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
              d="M232.7 69.9C237.1 56.8 249.3 48 263.1 48L377 48C390.8 48 403 56.8 407.4 69.9L416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L128 160C110.3 160 96 145.7 96 128C96 110.3 110.3 96 128 96L224 96L232.7 69.9zM128 208L512 208L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 208zM216 272C202.7 272 192 282.7 192 296L192 488C192 501.3 202.7 512 216 512C229.3 512 240 501.3 240 488L240 296C240 282.7 229.3 272 216 272zM320 272C306.7 272 296 282.7 296 296L296 488C296 501.3 306.7 512 320 512C333.3 512 344 501.3 344 488L344 296C344 282.7 333.3 272 320 272zM424 272C410.7 272 400 282.7 400 296L400 488C400 501.3 410.7 512 424 512C437.3 512 448 501.3 448 488L448 296C448 282.7 437.3 272 424 272z"
            />
          </svg></button
        ><button data-i18n-aria-label="archive.recently_closed_tabs"
          class="recent-button"
          type="button"
          aria-label="Недавно закрытые вкладки"
          aria-expanded="false"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              class="recent-ring"
              d="M2.5 7.5a5.5 5.5 0 1 1 1.61 3.89M1 4.7l1.5 2.8 2.8-1.5"
            />
            <path d="M8 5v3l2 1.2" />
          </svg>
        </button>
      </div>
    </main>
    <script src="dist/app.js"></script>
  </body>
</html>
